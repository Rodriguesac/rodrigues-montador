<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4B0082"><meta name="description" content="Monte seu pedido de açaí Rodrigues com cardápio independente.">
<title>Monte seu pedido • Rodrigues Açaí e Cia</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--roxo:#4B0082;--verde:#82C91E;--escuro:#310052;--branco:#fff}*{box-sizing:border-box}
html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0,#7c32b4 0,transparent 30%),linear-gradient(160deg,#4B0082,#310052);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;min-height:100dvh}button,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,textarea:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
.shell{max-width:580px;margin:auto;padding:15px 15px 95px}.head{position:sticky;top:8px;z-index:5;background:#fffefa;color:var(--roxo);border-radius:32px;padding:18px;box-shadow:0 22px 38px #19002f65}
.brand{display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:15px;background:var(--roxo);color:var(--verde);display:grid;place-items:center;font-size:25px;font-weight:1000}.name{flex:1;min-width:0}.name b{font-size:17px;font-weight:1000;font-style:italic;display:block;text-transform:uppercase}.name small{font-size:9px;color:#68a310;letter-spacing:1.8px;font-weight:900}.price{background:var(--verde);padding:11px 12px;border-radius:15px;font-weight:1000;white-space:nowrap;font-size:14px}
.progress{display:flex;gap:2px;justify-content:space-between;margin-top:21px;position:relative}.progress:before{content:"";position:absolute;top:13px;left:12px;right:12px;height:3px;background:#e8e4ec}.progress>div{flex:1;min-width:0;text-align:center;position:relative}.progress b{display:grid;place-items:center;margin:auto;width:29px;height:29px;background:#f5f2f7;border:2px solid #eee5f4;border-radius:50%;font-size:11px;color:#aa9ab8}.progress .done b,.progress .now b{color:var(--verde);background:var(--roxo);border-color:var(--roxo)}.progress small{display:block;font-size:8px;margin-top:6px;font-weight:800;color:#aa9eb3}.progress .now small{color:var(--roxo)}
h1{text-transform:uppercase;text-align:center;font-size:29px;font-weight:1000;letter-spacing:-1px;font-style:italic;margin:31px 0 6px;line-height:1.08}p.intro{text-align:center;font-size:12px;opacity:.86;margin:0 0 24px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.base{height:220px;border-radius:35px;position:relative;border:5px solid transparent;overflow:hidden;background:#661199;color:#fff;padding:0;box-shadow:0 15px 35px #19002c77}.base img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.base:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#34005eea)}.base strong{position:absolute;z-index:1;bottom:19px;left:5px;right:5px;text-align:center;text-transform:uppercase;font-weight:1000;font-size:15px;font-style:italic;text-shadow:0 2px 5px #000a}.active{border-color:var(--verde)!important;box-shadow:0 0 0 3px #82c91e61,0 12px 30px #13002777!important}
.check{position:absolute;top:7px;right:9px;padding:6px 9px;background:var(--verde);color:var(--roxo);border-radius:12px;z-index:2;display:none;font-weight:1000}.active .check{display:block}
.size,.cover,.choice{width:100%;background:white;color:var(--roxo);border:4px solid transparent;border-radius:29px;padding:13px;display:flex;align-items:center;gap:15px;text-align:left;margin-bottom:12px;box-shadow:0 10px 25px #1d003a55}.size img,.cover img{width:78px;height:78px;object-fit:cover;border-radius:21px;background:#f0ebf3}.size .desc,.cover .desc{flex:1}.size .desc strong,.cover .desc strong{font-size:17px;font-weight:1000;font-style:italic;display:block;text-transform:uppercase}.size small{font-size:10px;display:block;color:#76a628;font-weight:900;margin-top:4px}.cost{background:#f6f1f9;border-radius:13px;font-weight:1000;font-size:15px;padding:9px}
.counter{padding:18px;border:1px solid #ffffff36;border-radius:27px;text-align:center;background:#ffffff18;margin-bottom:18px}.counter strong{font-size:19px;font-style:italic}.counter p{color:var(--verde);font-weight:900;margin:6px 0 0}
.pick,.extra{background:#fff;color:var(--roxo);border:4px solid transparent;border-radius:28px;text-align:center;position:relative;box-shadow:0 8px 22px #1e003b4d;min-height:175px;padding:10px}.pick img,.extra img{width:100%;height:109px;object-fit:cover;background:#f6f3fa;border-radius:20px}.pick strong,.extra strong{font-size:12px;font-weight:1000;line-height:1.25;display:block;text-transform:uppercase;margin-top:9px}.pick:disabled{opacity:.42}.extra{display:flex;flex-direction:column;min-height:210px}.extra strong{min-height:30px}.extra small{font-size:11px;color:#835b98;margin:5px 0 0;font-weight:800}.qty{margin-top:auto;padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:5px}.qty button{border:0;min-width:37px;height:37px;border-radius:12px;background:#e9def2;color:var(--roxo);font-size:22px;font-weight:900}.qty button.plus{background:var(--verde)}.qty b{font-size:17px}
.choice{min-height:75px;font-weight:900;font-size:16px;justify-content:space-between}.review{background:#fff;color:var(--roxo);padding:20px;border-radius:27px;margin-bottom:14px;box-shadow:0 10px 25px #1d003a55}.review h2{font-size:19px;margin:0 0 14px}.review p{font-size:13px;color:#6e5f7a;line-height:1.55}.review .line{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #f0eaf4;padding:13px 0;font-weight:800}.review .big{font-size:22px;font-weight:1000}
.note{width:100%;padding:15px;border-radius:20px;border:0;min-height:90px;resize:vertical;color:var(--roxo)}.cartitem{border-bottom:1px solid #eee5f5;padding:12px 0;display:flex;gap:12px;justify-content:space-between}.cartitem:last-of-type{border-bottom:0}.cartitem b{display:block;font-size:13px}.cartitem small{display:block;color:#756883;font-size:11px;margin-top:5px}.remove{border:0;background:#ffe3e8;color:#aa1c34;border-radius:9px;padding:9px 10px;align-self:center}
.controls{position:sticky;bottom:10px;z-index:4;display:flex;gap:9px;margin:24px 0 0;padding:9px;background:#280049e0;border-radius:23px;backdrop-filter:blur(10px)}.btn{min-height:54px;border-radius:16px;border:0;padding:15px 13px;font-weight:1000;font-size:14px}.btn.go{background:var(--verde);color:var(--roxo);flex:1}.btn.back{background:#ffffff24;border:1px solid #ffffff55;color:white}.btn:disabled{opacity:.4;cursor:not-allowed}.empty{text-align:center;padding:30px;opacity:.9}.footer{text-align:center;font-size:10px;color:#d3bde3;margin:25px 0}.label{display:block;margin:10px 0 9px;font-size:12px;font-weight:900}
@media(max-width:370px){.shell{padding-left:10px;padding-right:10px}.cards{gap:10px}.base{height:192px}.size img{width:60px;height:60px}.size .desc strong{font-size:14px}.size .cost{font-size:12px;padding:8px}.progress small{font-size:7px}}
</style>
</head><body><div class="shell"><header class="head"><div class="brand"><div class="logo">R</div><div class="name"><b>Rodrigues Açaí</b><small>Montagem Premium</small></div><div id="subtotal" class="price">R$ 0,00</div></div><div id="progress" class="progress"></div></header><main id="area"></main><nav class="controls" id="controls"></nav><div class="footer">Rodrigues Açaí e Cia • Monte seu pedido independente</div></div>
<script>
"use strict";
const $=x=>document.getElementById(x);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=x=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(x)||0);
const start=()=>({base:"",size:"",gratis:[],cobertura:"",extras:{},colher:"Não",obs:""});
const steps=["Base","Tamanho","Grátis","Calda","Extras","Colher","Revisão","Sacola"];
let C={},app={step:0,item:start(),cart:[]};
try{const s=JSON.parse(localStorage.getItem("rac_montador_offline_v1")||"null");if(s&&Array.isArray(s.cart))app={...app,...s};}catch(e){}
function persist(){try{localStorage.setItem("rac_montador_offline_v1",JSON.stringify(app));}catch(e){}}
function itemOf(xs,id){return(xs||[]).find(x=>x.id===id);}
const b=()=>itemOf(C.bases,app.item.base),s=()=>itemOf(C.cardapio_acai,app.item.size);
function value(){let n=b()&&s()?Number(s()[b().cat]||0):0;for(let x of C.adicionais||[])n+=Number(app.item.extras[x.id]||0)*Number(x.preco||0);return Math.round(n*100)/100;}
function picture(it){return it.imagem_url?'<img alt="'+esc(it.nome)+'" loading="lazy" src="'+esc(it.imagem_url)+'" onerror="this.style.opacity=0">':'';}
function move(next){app.step=Math.max(0,Math.min(7,next));persist();render();scrollTo({top:0,behavior:"smooth"});}
function draw(){
 let a=app.item,body="",title="",desc="";
 if(app.step===0){title="Escolha sua base";desc="A primeira etapa da sua combinação.";body='<div class="cards">'+C.bases.map(x=>'<button type="button" class="base '+(a.base===x.id?'active':'')+'" data-action="base" data-id="'+esc(x.id)+'">'+picture(x)+'<span class="check">✓</span><strong>'+esc(x.nome)+'</strong></button>').join("")+'</div>';}
 if(app.step===1){title="Escolha o tamanho";desc="Cada tamanho inclui acompanhamentos grátis.";body=C.cardapio_acai.map(x=>'<button type="button" class="size '+(a.size===x.id?'active':'')+'" data-action="size" data-id="'+esc(x.id)+'">'+picture(x)+'<span class="desc"><strong>'+esc(x.nome)+'</strong><small>🎁 '+x.limite+' acompanhamentos grátis</small></span><span class="cost">'+money(x[b()?.cat]||0)+'</span></button>').join("");}
 if(app.step===2){title="Mix de acompanhamentos";desc="Escolha seus favoritos.";let max=s()?.limite||0;body='<div class="counter"><strong>Escolha os complementos grátis</strong><p>'+a.gratis.length+' selecionados de '+max+'</p></div><div class="cards">'+C.acompanhamentos_gratis.map(x=>{const selected=a.gratis.includes(x.id);return '<button type="button" class="pick '+(selected?'active':'')+'" '+(!selected&&a.gratis.length>=max?'disabled':'')+' data-action="gratis" data-id="'+esc(x.id)+'">'+picture(x)+'<strong>'+esc(x.nome)+'</strong><span class="check">✓</span></button>';}).join("")+'</div>';}
 if(app.step===3){title="Toque final";desc="Selecione uma calda, se desejar.";body='<button type="button" class="choice '+(!a.cobertura?'active':'')+'" data-action="cobertura" data-id="">Sem cobertura <span>✓</span></button>'+C.coberturas.map(x=>'<button type="button" class="cover '+(a.cobertura===x.id?'active':'')+'" data-action="cobertura" data-id="'+esc(x.id)+'">'+picture(x)+'<span class="desc"><strong>'+esc(x.nome)+'</strong></span>✓</button>').join("");}
 if(app.step===4){title="Adicionais extras";desc="Os extras são cobrados separadamente.";body='<div class="cards">'+C.adicionais.map(x=>{const q=a.extras[x.id]||0;return '<div class="extra '+(q?'active':'')+'">'+picture(x)+'<strong>'+esc(x.nome)+'</strong><small>'+money(x.preco)+' por porção</small><div class="qty"><button type="button" data-action="menos" data-id="'+esc(x.id)+'" aria-label="Retirar '+esc(x.nome)+'">−</button><b>'+q+'</b><button class="plus" type="button" data-action="mais" data-id="'+esc(x.id)+'" aria-label="Adicionar '+esc(x.nome)+'">+</button></div></div>'}).join("")+'</div>';}
 if(app.step===5){title="Precisa de colher?";desc="Selecione a sua preferência.";body='<button type="button" class="choice '+(a.colher==="Sim"?'active':'')+'" data-action="colher" data-id="Sim">🥄 Sim, enviar colher <span>✓</span></button><button type="button" class="choice '+(a.colher==="Não"?'active':'')+'" data-action="colher" data-id="Não">Sem colher <span>✓</span></button>';}
 if(app.step===6){title="Confira sua montagem";desc="Revise seu açaí antes de adicionar à sacola.";const g=C.acompanhamentos_gratis.filter(x=>a.gratis.includes(x.id)).map(x=>x.nome),e=C.adicionais.filter(x=>(a.extras[x.id]||0)>0).map(x=>a.extras[x.id]+'× '+x.nome);body='<div class="review"><h2>'+esc(b()?.nome)+' · '+esc(s()?.nome)+'</h2><p><b>Acompanhamentos:</b> '+esc(g.join(", ")||"Nenhum")+'</p><p><b>Cobertura:</b> '+esc(itemOf(C.coberturas,a.cobertura)?.nome||"Sem cobertura")+'</p><p><b>Adicionais:</b> '+esc(e.join(", ")||"Nenhum")+'</p><p><b>Colher:</b> '+esc(a.colher)+'</p><div class="line"><b>Total do item</b><b class="big">'+money(value())+'</b></div></div><label class="label" for="notes">Observações (opcional)</label><textarea id="notes" class="note" maxlength="400" placeholder="Ex.: leite em pó por cima">'+esc(a.obs)+'</textarea>';}
 if(app.step===7){title="Sua sacola";desc="Tudo pronto para compartilhar com a loja.";body=app.cart.length?'<div class="review"><h2>'+app.cart.length+' item(ns) montado(s)</h2>'+app.cart.map((x,i)=>'<div class="cartitem"><div><b>'+esc(x.nome)+'</b><small>'+esc(x.desc)+'</small><small>'+money(x.total)+'</small></div><button class="remove" type="button" data-action="remove" data-id="'+i+'">Remover</button></div>').join("")+'<div class="line"><b>Total dos itens</b><b class="big">'+money(app.cart.reduce((v,x)=>v+x.total,0))+'</b></div></div><div class="review"><p>Este modo funciona sem banco de dados. O pedido não entra automaticamente no gestor: envie pelo WhatsApp e aguarde confirmação da loja.</p><button type="button" class="btn go" style="width:100%;margin-bottom:10px" data-action="copy">Copiar pedido</button><button type="button" class="btn go" style="width:100%" data-action="whatsapp">Enviar pelo WhatsApp</button></div>':'<div class="empty">Nenhum item na sacola.</div>';}
 $("area").innerHTML='<h1>'+title+'</h1><p class="intro">'+desc+'</p>'+body;
}
function render(){
 if(!app.item||typeof app.item!=="object")app.item=start();
 $("subtotal").textContent=money(app.step===7?app.cart.reduce((v,x)=>v+x.total,0):value());
 $("progress").innerHTML=steps.map((x,i)=>'<div class="'+(i===app.step?'now':i<app.step?'done':'')+'"><b>'+(i<app.step?'✓':i+1)+'</b><small>'+x+'</small></div>').join("");
 draw();let buttons="";
 if(app.step>0&&app.step<7)buttons+='<button type="button" class="btn back" data-action="back">← Voltar</button>';
 if(app.step<6)buttons+='<button type="button" class="btn go" data-action="next" '+(app.step===0&&!app.item.base||app.step===1&&!app.item.size?'disabled':'')+'>Próximo →</button>';
 if(app.step===6)buttons+='<button type="button" class="btn go" data-action="add">Adicionar à sacola ✓</button>';
 if(app.step===7)buttons+='<button type="button" class="btn go" data-action="new">+ Montar outro açaí</button>';
 if(app.step<7&&app.cart.length)buttons+='<button type="button" class="btn back" data-action="cart">🛒 '+app.cart.length+'</button>';
 $("controls").innerHTML=buttons;
}
function textOrder(){return '🍇 *RODRIGUES AÇAÍ E CIA — PEDIDO MONTADO*\n\n'+app.cart.map((x,i)=>'*'+(i+1)+'. '+x.nome+'*\n'+x.desc+'\n*Subtotal:* '+money(x.total)).join('\n\n')+'\n\n*TOTAL DOS ITENS:* '+money(app.cart.reduce((v,x)=>v+x.total,0))+'\n\n⚠️ Confirme os preços, seu nome, endereço ou retirada e pagamento com a loja. Não é um pedido confirmado.';}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-action]");if(!t)return;
 const act=t.dataset.action,id=t.dataset.id||"",a=app.item;
 if(act==="base"){a.base=id;a.size="";a.gratis=[];}
 if(act==="size"){a.size=id;a.gratis=a.gratis.slice(0,s()?.limite||0);}
 if(act==="gratis"){const i=a.gratis.indexOf(id);if(i<0&&a.gratis.length<(s()?.limite||0))a.gratis.push(id);else if(i>=0)a.gratis.splice(i,1);}
 if(act==="cobertura")a.cobertura=id;
 if(act==="colher")a.colher=id;
 if(act==="mais")a.extras[id]=Math.min(20,(a.extras[id]||0)+1);
 if(act==="menos")a.extras[id]=Math.max(0,(a.extras[id]||0)-1);
 if(act==="back"){move(app.step-1);return;}
 if(act==="next"){if(app.step===0&&!a.base||app.step===1&&!a.size)return;move(app.step+1);return;}
 if(act==="add"){if(!b()||!s())return;const g=C.acompanhamentos_gratis.filter(x=>a.gratis.includes(x.id)).map(x=>x.nome),x=C.adicionais.filter(x=>(a.extras[x.id]||0)>0).map(x=>a.extras[x.id]+'× '+x.nome);app.cart.push({nome:b().nome+' · '+s().nome,desc:'Acompanhamentos: '+(g.join(", ")||"nenhum")+' | Cobertura: '+(itemOf(C.coberturas,a.cobertura)?.nome||"sem cobertura")+' | Adicionais: '+(x.join(", ")||"nenhum")+' | Colher: '+a.colher+(a.obs?' | OBS: '+a.obs:''),total:value()});app.item=start();move(7);return;}
 if(act==="remove"){app.cart.splice(Number(id),1);}
 if(act==="new"){app.item=start();move(0);return;}
 if(act==="cart"){move(7);return;}
 if(act==="copy"){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(textOrder()).then(()=>alert("Pedido copiado"),()=>prompt("Copie seu pedido:",textOrder()));else prompt("Copie seu pedido:",textOrder());return;}
 if(act==="whatsapp"){window.open("https://wa.me/?text="+encodeURIComponent(textOrder()),"_blank","noopener");return;}
 persist();render();
});
document.addEventListener("input",e=>{if(e.target.id==="notes"){app.item.obs=e.target.value;persist();}});
fetch("./catalogo-estatico.json",{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error("Catálogo indisponível");return r.json()}).then(data=>{C=data;render();}).catch(()=>{$("area").innerHTML='<div class="empty">Não foi possível carregar o cardápio desta versão. Verifique a conexão e recarregue.</div>';});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
